<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="theme-color" content="#241812"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=contain"><title>시간 낭비의 숲 · v3.0.13</title><link rel="stylesheet" href="launcher.css"><script defer src="launcher.js"></script></head>
<body class="launcher">
<div id="world" aria-hidden="true"></div>
<div id="cast" aria-hidden="true"></div>
<div id="veil"></div>
<main id="entry">
  <div id="hero"><img src="web/ui/logo.png" alt="" width="160" height="96"><div><h1>시간 낭비의 숲</h1><p class="intro">숲에서 시작하는 자동전투 모험</p><div class="version">v3.0.13 · 웹 베타</div></div></div>
  <section class="board" aria-labelledby="board-title">
    <h2 id="board-title">숲으로 들어가기</h2>
    <form id="auth">
      <div id="account-fields">
        <label>아이디<input name="id" autocomplete="username" pattern="[a-zA-Z0-9_]{3,64}" minlength="3" maxlength="64" required></label>
        <label>비밀번호<input name="pw" type="password" autocomplete="current-password" minlength="4" maxlength="128" required></label>
      </div>
      <div id="signup-fields" hidden><p class="hint">함께 모험할 캐릭터를 정해 주세요.</p><label>캐릭터 이름<input name="name" maxlength="10"></label><fieldset class="gender"><legend>캐릭터</legend><label><input type="radio" name="gender" value="male" checked><span>남성</span></label><label><input type="radio" name="gender" value="female"><span>여성</span></label></fieldset></div>
      <button type="submit" id="submit">로그인</button>
      <div class="row"><button type="button" id="mode" class="secondary">회원가입</button><button type="button" id="google" class="secondary">Google로 계속</button></div>
    </form>
    <form id="google-signup" hidden>
      <p class="hint">Google 계정으로 처음 오셨어요. 함께 모험할 캐릭터를 정해 주세요.</p>
      <label>캐릭터 이름<input name="name" maxlength="10" required></label><fieldset class="gender"><legend>캐릭터</legend><label><input type="radio" name="gender" value="male" checked><span>남성</span></label><label><input type="radio" name="gender" value="female"><span>여성</span></label></fieldset>
      <button type="submit">가입하고 시작</button>
    </form>
    <div id="ready" hidden><p id="greeting" class="hint"></p><div id="channel-list" role="radiogroup" aria-label="채널"></div><select id="channels" hidden aria-hidden="true"></select><button id="play">플레이</button><button id="logout" class="secondary">로그아웃</button></div>
    <p id="status" role="status" aria-live="polite"></p>
  </section>
  <p class="legal"><a href="https://game-origin.1bit.kr/game/terms.html">이용약관</a> · <a href="https://game-origin.1bit.kr/game/privacy.html">개인정보처리방침</a></p>
</main>
<section id="game" hidden><div id="toolbar"><span>시간 낭비의 숲 · v3.0.13</span><button id="fullscreen">전체 화면</button><button id="exit">나가기</button></div><div id="viewport"><canvas id="unity-canvas" width="1280" height="720" tabindex="0" aria-label="자동전투 게임"></canvas></div><div id="chat" hidden><div id="chat-log" role="log" aria-live="polite"></div><div id="chat-row"><input id="chat-input" maxlength="120" placeholder="메시지 입력 · Enter" autocomplete="off" enterkeyhint="send" aria-label="채팅 입력"><button id="chat-send">보내기</button><button id="chat-potion" class="secondary">포션</button></div></div><p id="loading" role="status"></p></section>
</body></html>
