<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>시간 낭비의 숲 · v3.0.5</title><link rel="stylesheet" href="/launcher.css"><script defer src="/launcher.js"></script></head>
<body>
<main id="entry">
  <div class="version">v3.0.5 · 웹 베타</div><h1>시간 낭비의 숲</h1><p class="intro">숲에서 시작하는 자동전투 모험</p>
  <form id="auth">
    <label>아이디<input name="id" autocomplete="username" pattern="[a-zA-Z0-9_]{3,64}" minlength="3" maxlength="64" required></label>
    <label>비밀번호<input name="pw" type="password" autocomplete="current-password" minlength="4" maxlength="128" required></label>
    <div id="signup-fields" hidden><label>캐릭터 이름<input name="name" maxlength="10"></label><label>캐릭터<select name="gender"><option value="male">남성</option><option value="female">여성</option></select></label></div>
    <button type="submit" id="submit">로그인</button><button type="button" id="mode" class="secondary">회원가입</button>
  </form>
  <div id="ready" hidden><p id="greeting"></p><label>채널<select id="channels"></select></label><button id="play">플레이</button><button id="logout" class="secondary">로그아웃</button></div>
  <p id="status" role="status" aria-live="polite"></p>
</main>
<section id="game" hidden><div id="toolbar"><span>시간 낭비의 숲 · v3.0.5</span><button id="fullscreen">전체 화면</button><button id="exit">나가기</button></div><div id="viewport"><canvas id="unity-canvas" width="1280" height="720" tabindex="0" aria-label="자동전투 게임"></canvas></div><p id="loading" role="status"></p></section>
</body></html>
