name: deploy

on:
  push:
    branches: [main]
    paths: ["field/**", "k8s/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

# 배포 run이 겹치면 같은 StatefulSet에 set image가 경합한다. group이 같은 run끼리만 줄 세우고,
# cancel-in-progress: false 라 뒤에 온 run은 앞 run이 끝날 때까지 대기(취소 아님).
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  REGION: asia-northeast3
  IMAGE_BASE: asia-northeast3-docker.pkg.dev/personal-webgame-project/web-game-images/web-game

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # id-token: write 가 있어야 다음 auth 스텝이 GitHub OIDC 토큰을 받아 WIF 인증을 탄다.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Smoke test
        working-directory: field
        run: |
          npm ci --omit=dev
          npm test
          node test_night.js
          node test_qa_night.js
          node --check server.js
          node --check launcher.js
          test -f web/build.json

      # WIF: 키 파일 없이 OIDC 토큰으로 wif.tf에 등록된 서비스 계정을 임퍼서네이션한다.
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          # vars.* 는 비밀 아닌 값(Secrets 탭 아님). 프로바이더 경로라 노출돼도 무해.
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: wif-service-account@personal-webgame-project.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build & push (amd64, version and commit tag)
        working-directory: field
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          VERSION="$(node -p "require('./package.json').version")"
          IMAGE="${IMAGE_BASE}:v${VERSION}-${GITHUB_SHA:0:12}"
          docker build --platform linux/amd64 -t "$IMAGE" .
          docker push "$IMAGE"
          # $GITHUB_ENV 에 append하면 이후 스텝에서 $IMAGE로 그대로 쓸 수 있다.
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # `gcloud container clusters get-credentials` 대체 — kubeconfig를 러너에 만들어준다.
      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: web-game-cluster
          location: asia-northeast3-a

      - name: Roll out to both StatefulSets
        run: |
          kubectl set image statefulset/channel-main channel="$IMAGE"
          kubectl set image statefulset/channel      channel="$IMAGE"
          # 이게 없으면 새 이미지가 실제로 떴는지 확인 안 하고 워크플로가 그냥 초록불로 끝난다.
          kubectl rollout status statefulset/channel-main --timeout=180s
          kubectl rollout status statefulset/channel      --timeout=300s
