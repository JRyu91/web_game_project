#Ingress 는 "LB 하나 만들어줘" 라는 주문서다. 이거 올리면 GKE 가 NEG·백엔드·URL맵·프록시·포워딩규칙을 알아서 다 만든다.
#network.tf 의 LB 4종을 주석으로 남겨둔 이유가 이것. 같은 물건이라 둘 다 켜면 LB 가 2개(월 $36.5)가 된다.
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: channel-backend
spec:
  timeoutSec: 3600 #GCP LB 기본값이 30초다. 안 늘리면 WebSocket 이 30초마다 끊긴다
  healthCheck:
    type: HTTP
    requestPath: /healthz #기본값(/)으로 두면 드레인중인 파드도 index.html 을 200 으로 줘서 LB 가 계속 트래픽을 보낸다
    port: 8080
    checkIntervalSec: 5
    timeoutSec: 3
    healthyThreshold: 1
    unhealthyThreshold: 2
  connectionDraining:
    drainingTimeoutSec: 660 #파드쪽 terminationGracePeriodSeconds 와 맞춰둔다
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: channel
  annotations:
    #ingressClassName: gce 를 쓰려면 클러스터에 gce IngressClass 리소스가 있어야 하는데 이 클러스터엔 없다(destroy/recreate 여파).
    #이 구식 어노테이션은 그 리소스 없이도 GKE 컨트롤러가 인식한다. 이게 없으면 컨트롤러가 인그레스를 무시해서 ADDRESS 가 영영 안 붙는다.
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "web-game-static-ip" #이 줄 없으면 Ingress 가 새 IP 를 뽑아버려서 A레코드랑 어긋나고 인증서가 영영 안 나온다
    ingress.gcp.kubernetes.io/pre-shared-cert: "web-game-cert,web-game-origin-cert" #dns.tf 가 만든 인증서를 이름으로 빌려 쓴다. origin 은 Cloudflare Worker 용
    kubernetes.io/ingress.allow-http: "true" #끄지 말 것. 인증서 검증 경로에 영향을 줄 수 있다
spec:
  rules:
    #host 를 안 건다: 1bit.kr(전환 전 직결) 과 Worker 가 부르는 origin 호스트 둘 다 받아야 한다
    - http:
        paths:
          #채널 5개(KEDA max)만큼 경로를 미리 다 깔아둔다. 파드가 아직 안 뜬 채널(3,4번)은 백엔드가 비어서
          #GKE 가 UNHEALTHY 로 표시하는데, KEDA 가 그 파드를 띄우는 순간 살아난다. Ingress 자체는 안 죽는다.
          #GKE Ingress 는 경로 재작성이 없어서 파드가 /game/ch3/core.js 를 그대로 받는다 → server.js 가 앞의 /game/ch3 을 뗀다.
          #GCE URL맵은 가장 긴 경로가 이기므로 /game/chN 이 /game/* 보다 먼저 잡힌다.
          - path: /game
            pathType: ImplementationSpecific
            backend: { service: { name: channel-0, port: { number: 8080 } } }
          - path: /game/*
            pathType: ImplementationSpecific
            backend: { service: { name: channel-0, port: { number: 8080 } } }
          - path: /game/ch0
            pathType: ImplementationSpecific
            backend: { service: { name: channel-0, port: { number: 8080 } } }
          - path: /game/ch0/*
            pathType: ImplementationSpecific
            backend: { service: { name: channel-0, port: { number: 8080 } } }
          - path: /game/ch1
            pathType: ImplementationSpecific
            backend: { service: { name: channel-1, port: { number: 8080 } } }
          - path: /game/ch1/*
            pathType: ImplementationSpecific
            backend: { service: { name: channel-1, port: { number: 8080 } } }
          - path: /game/ch2
            pathType: ImplementationSpecific
            backend: { service: { name: channel-2, port: { number: 8080 } } }
          - path: /game/ch2/*
            pathType: ImplementationSpecific
            backend: { service: { name: channel-2, port: { number: 8080 } } }
          - path: /game/ch3
            pathType: ImplementationSpecific
            backend: { service: { name: channel-3, port: { number: 8080 } } }
          - path: /game/ch3/*
            pathType: ImplementationSpecific
            backend: { service: { name: channel-3, port: { number: 8080 } } }
          - path: /game/ch4
            pathType: ImplementationSpecific
            backend: { service: { name: channel-4, port: { number: 8080 } } }
          - path: /game/ch4/*
            pathType: ImplementationSpecific
            backend: { service: { name: channel-4, port: { number: 8080 } } }
  defaultBackend:
    service: { name: channel-0, port: { number: 8080 } } #채널 안 정하고 그냥 1bit.kr 로 오면 0번으로 보낸다
