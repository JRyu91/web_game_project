#1~4번 채널, 스팟 노드에서 값싸게 버스트. KEDA 가 replicas 를 1~4 로 조절한다.
#선점당해도 홈 채널(0번)은 멀쩡하고 접속자는 server.js 드레인이 다른 채널로 넘긴다.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: channel
  labels: { app: channel }
spec:
  serviceName: channel
  replicas: 1 #시작값. KEDA(scaledobject.yaml)가 1~4 로 잡는다
  podManagementPolicy: Parallel
  ordinals:
    start: 1 #channel-1, channel-2, ... 로 시작. 기본값 0 이면 channel-0 이 되어 main 과 충돌한다
  selector:
    matchLabels: { app: channel }
  template:
    metadata:
      labels: { app: channel }
    spec:
      #main 은 660초 정식 드레인, sub 는 60초 — 선점 시 좀비 파드가 660초씩 롤아웃 막는 걸 피함.
      terminationGracePeriodSeconds: 60
      #스팟 노드의 자동 taint 를 참아준다 = 스팟에 올라갈 수 있다
      tolerations:
        - key: cloud.google.com/gke-spot
          operator: Equal
          value: "true"
          effect: NoSchedule
      #스팟을 선호(required 아님). 스팟 노드가 0대면 core 로 떨어져서 바로 뜬다.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: pool
                    operator: In
                    values: ["spot"]
      containers:
        - name: channel
          image: asia-northeast3-docker.pkg.dev/personal-webgame-project/web-game-images/web-game:v3.0.3
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: CHANNEL_ID
              valueFrom:
                fieldRef: { fieldPath: metadata.name } #channel-1 등 → 끝 숫자가 채널 번호
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: db-credentials, key: DATABASE_URL }
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: game-admin-credentials, key: ADMIN_PASSWORD }
            - name: CHANNEL_BASES
              value: "/ch0,/ch1,/ch2,/ch3,/ch4"
            - name: DRAIN_TIMEOUT_SEC
              value: "50" #terminationGracePeriodSeconds(60)보다 짧게. 서버가 먼저 정리하고 나가게 해서 SIGKILL 을 피한다
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: channel #StatefulSet 이 요구하는 헤드리스 Service
spec:
  clusterIP: None
  selector: { app: channel }
  ports:
    - port: 8080
      targetPort: 8080
---
#Ingress 의 /ch1~/ch4 가 물고 있는 파드별 Service. KEDA 가 아직 안 띄운 채널의 Service 는
#백엔드가 비어 UNHEALTHY 로 뜨지만, 그 파드가 생기는 순간 살아난다. Ingress 자체는 안 죽는다.
apiVersion: v1
kind: Service
metadata:
  name: channel-1
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "channel-backend"}'
spec:
  selector:
    statefulset.kubernetes.io/pod-name: channel-1
  ports:
    - port: 8080
      targetPort: 8080
---
